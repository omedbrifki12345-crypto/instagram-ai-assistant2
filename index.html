<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram AI Studio</title>

<style>
body {
  background: #10101c;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}
h1 { color: #a78bfa; }
.card {
  background: #202035;
  padding: 25px;
  margin: 20px auto;
  border-radius: 15px;
  max-width: 600px;
}
input, select, textarea {
  padding: 12px;
  width: 85%;
  margin: 10px;
  border-radius: 8px;
  border: none;
}
button {
  background: #8b5cf6;
  color: white;
  padding: 13px 25px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
#result {
  white-space: pre-wrap;
  line-height: 1.6;
}
</style>
</head>

<body>

<h1>🚀 Instagram AI Studio</h1>
<p>Your personal AI video assistant</p>

<div class="card">
<h2>🧠 Choose Your AI</h2>

<select id="ai">
<option>ChatGPT</option>
<option>Claude</option>
<option>Gemini</option>
</select>

<h2>🎬 Video Idea Generator</h2>

<input id="topic" placeholder="Enter your video topic">

<button onclick="generate()">Generate Idea</button>

<h2>📝 Your Script</h2>
<p id="result">Your script will appear here.</p>

<button onclick="copyScript()">Copy Script</button>
</div>

<div class="card">
<h2>🎙️ AI Voice Generator</h2>
<p>Coming soon!</p>
</div>

<div class="card">
<h2>📱 Instagram Reels</h2>
<p>Coming soon!</p>
</div>

<script>
async function generate() {
    let topic = document.getElementById("topic").value;
    let ai = document.getElementById("ai").value;

    if (!topic.trim()) {
        alert("Please enter a video topic!");
        return;
    }

    document.getElementById("result").innerText = "Generating script...";

    try {
        const response = await fetch(
            "https://instagram-ai-assistant2.vercel.app/generate-script",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ topic: topic })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Something went wrong");
        }

        document.getElementById("result").innerText =
            "Selected AI: Gemini\n\n" + data.script;

    } catch (error) {
        document.getElementById("result").innerText =
            "Error: " + error.message;
    }
}
